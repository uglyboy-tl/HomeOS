name: image

# 镜像与 Release 只在版本 tag 上出（v0.2.0 这种）；main 与 PR 只跑测试。
on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:

permissions:
  contents: read

concurrency:
  group: image-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
      - run: uv sync --frozen
      - run: uv run ruff check .
      - run: uv run ruff format --check .
      - run: uv run pytest -q

  image:
    needs: test
    # 只有版本 tag 才构建：一次 arm64 走 QEMU 十几分钟，main 上每次都推包不值。
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    # contents: write 用来建 Release；packages: write 用来推镜像。
    permissions:
      contents: write
      packages: write
    steps:
      - uses: actions/checkout@v4
      # 只有 arm64：opencode 只发 arm64 release，amd64 构建会直接失败。
      # GitHub 托管 runner 是 amd64，所以走 QEMU 模拟（能跑，比真机慢几分钟）。
      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository }}
          tags: |
            type=semver,pattern={{version}}
            # compose.yaml 里钉的是 :latest，所以 release 除了版本号还要推 latest
            type=raw,value=latest,enable=${{ startsWith(github.ref, 'refs/tags/v') }}
      - uses: docker/build-push-action@v6
        with:
          context: .
          file: docker/Dockerfile
          platforms: linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
      # Release 与镜像同一次构建：有 Release 就说明镜像已推好。--latest 让 newest tag 成为 latest。
      # tag 一律用 vX.Y.Z：非三段（如 v1）匹配不上 semver，只会推 latest 覆盖稳定版
      - if: startsWith(github.ref, 'refs/tags/v')
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release create "$GITHUB_REF_NAME" --generate-notes --latest --verify-tag && exit 0
          echo "release 已存在，改成标记为 latest" >&2
          gh release edit "$GITHUB_REF_NAME" --latest
