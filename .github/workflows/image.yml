name: image

# main / 版本 tag 出镜像；PR 只跑测试，不推包。
on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: image-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
      - run: uv sync --frozen
      - run: uv run ruff check .
      - run: uv run ruff format --check .
      - run: uv run pytest -q

  image:
    needs: test
    # PR 上不构建：arm64 要跑 QEMU，一次十几分钟，不值得每 PR 都付；PR 只跑测试。
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    # 只有这个作业需要推包，别把 write 权限给跑 PR 代码的 test。
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4
      # 只有 arm64：opencode 只发 arm64 release，amd64 构建会直接失败。
      # GitHub 托管 runner 是 amd64，所以走 QEMU 模拟（能跑，比真机慢几分钟）。
      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository }}
          tags: |
            type=sha,format=short
            type=semver,pattern={{version}}
            type=raw,value=latest,enable={{is_default_branch}}
      - uses: docker/build-push-action@v6
        with:
          context: .
          file: docker/Dockerfile
          platforms: linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
