<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="color-scheme" content="light">
<title>助手</title>
<script>
  /* 把当前视口高度记成 --vh-px：软键盘弹出会改 100vh，这个值不变，字号因此不缩 */
  document.documentElement.style.setProperty('--vh-px', window.innerHeight + 'px');
</script>
<link rel="stylesheet" href="/assets/tokens.css?v=1">
<link rel="stylesheet" href="/assets/agent.css?v=29">
</head>
<body>
<main class="agent">
  <div class="agent-modes bar">
    <a class="back" href="/" aria-label="返回">←</a>
    <div class="agent-tabs bar-tabs" role="group" aria-label="模式"></div>
  </div>

  <div class="agent-log" role="log" aria-live="polite"></div>

  <form class="agent-say" autocomplete="off">
    <button type="button" class="agent-icon agent-new" aria-label="新对话">
      <!-- 内联图形：设备会缓存 icons.svg，新加的 symbol 拿不到 -->
      <svg class="icon" viewBox="0 0 24 24" aria-hidden="true"><path d="M12 4v16M4 12h16"/></svg>
    </button>
    <div class="agent-field">
      <textarea id="say" name="text" rows="1" placeholder="说点什么…"
                enterkeyhint="enter" aria-label="输入"></textarea>
      <button type="button" class="agent-mic" aria-label="语音输入（点一次开始，再点结束）"
              aria-pressed="false">
        <svg class="icon" viewBox="0 0 24 24" aria-hidden="true">
          <rect x="9" y="3" width="6" height="11" rx="3"/>
          <path d="M5 11a7 7 0 0 0 14 0M12 18v3M8 21h8"/>
        </svg>
      </button>
    </div>
    <button type="submit" class="agent-icon agent-send" aria-label="发送">
      <svg class="icon icon-send" viewBox="0 0 24 24" aria-hidden="true"><path d="M4 12h15M13 6l6 6-6 6"/></svg>
      <svg class="icon icon-stop" viewBox="0 0 24 24" aria-hidden="true"><rect x="6" y="6" width="12" height="12"/></svg>
    </button>
  </form>
</main>
<!-- 首帧由 agent.js 起来后画：与米家页同等程度的空一下，不为抢这一帧复制一套渲染 -->
<!-- 改 agent.js / agent.css 时把 v 加一：EinkBro 对子资源缓存很顽固，不换 URL 会跑旧代码 -->
<script src="/assets/agent.js?v=30" defer></script>
</body>
</html>
