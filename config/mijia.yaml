# 米家设备表：房间 → 设备。字段与坑的完整说明见 config/README.md。
# 字符串一律加引号：YAML 1.1 会把 on 读成布尔值、把纯数字 did 读成整数。

rooms:
  客厅:
    吸顶灯: { did: "1095838227", prop: "on-3" }
    射灯: { did: "1095838227", prop: "on-4" }
    羽毛灯: { did: "1095838227", prop: "on-2" } # 与吸顶灯同继电器，本体只用于调光
    景观灯: { did: "306242417", prop: "on-3" } # 插座的 USB 口，不是主插座
    阳台灯: { did: "624065104", prop: "on" } # 晾衣机自带的灯
    温湿度:
      kind: th
      did: "1095838227"
      props: { temperature: "temperature-6", humidity: "relative-humidity-6" }

  主卧:
    吸顶灯: { did: "1095834661", prop: "on-3" }
    书房筒灯: { did: "1095834661", prop: "on-4" } # 装在主卧开关上，照的是书房
    书房灯带: { did: "405232176", prop: "on" }
    温湿度:
      kind: th
      did: "1095834661"
      props: { temperature: "temperature-6", humidity: "relative-humidity-6" }

  次卧:
    吸顶灯: { did: "1041918964", prop: "on" }
    台灯: { did: "847008456", prop: "on-2" } # 没有 on
    温湿度:
      kind: th
      did: "blt.3.1p0p7el1kcg00"
      props: { temperature: "temperature", humidity: "relative-humidity" } # 蓝牙款没有后缀

    烟感:
      kind: smoke
      did: "blt.3.1k9cu3ingcg00"
      props: { status: "status", battery: "battery-level" }

# 播报音箱：不在房间里，是「念出来」这个出口。删掉则 /api/mijia/say 必须带 did
tts: { did: "380188346" }
