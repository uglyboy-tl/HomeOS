[project]
name = "homeos"
version = "0.3.3"
requires-python = ">=3.12"
dependencies = [
  "fastapi>=0.115",
  "uvicorn>=0.30",
  "watchfiles>=1.0",  # uvicorn --reload 用它走 inotify；没有它退化成 0.25s 轮询
  "websockets>=13.0",   # 语音识别：后端代理 Azure 的实时 WS
  "httpx>=0.27",
  "mijiaAPI>=5.0",   # 米家云：登录态在 $HOME/.config/mijia-api/auth.json
  "pyyaml>=6.0",     # 读 config/mijia.yaml
  "sse-starlette>=3.7.1",
  "python-mpd2>=3.1.1",
]

[dependency-groups]
dev = [
  "pytest>=8",
  "pytest-cov>=6",
  "pytest-randomly>=3.16",  # 顺序随机：失败时按日志里的 seed 用 --randomly-seed= 复跑
  "pytest-timeout>=2.3",
  "ruff>=0.9",
]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
addopts = "-ra -m 'not manual' --strict-markers --strict-config --timeout=60"
filterwarnings = [
  "error",
  # starlette 1.10 的 testclient 提示改装 httpx2：上游的事，等它换完再收
  "ignore:Using `httpx` with `starlette.testclient` is deprecated:UserWarning",
]
markers = ["manual: 需要真模型或真设备，CI 不跑"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "BLE", "SIM"]
