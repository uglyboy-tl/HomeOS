[project]
name = "homeos"
version = "0.3.1"
requires-python = ">=3.12"
dependencies = [
  "fastapi>=0.115",
  "uvicorn>=0.30",
  "watchfiles>=1.0",  # uvicorn --reload 用它走 inotify；没有它退化成 0.25s 轮询
  "websockets>=13.0",   # 语音识别：后端代理 Azure 的实时 WS
  "httpx>=0.27",
  "mijiaAPI>=5.0",   # 米家云：登录态在 $HOME/.config/mijia-api/auth.json
  "pyyaml>=6.0",     # 读 config/mijia.yaml
  "sse-starlette>=3.7.1",
  "python-mpd2>=3.1.1",
]

[dependency-groups]
dev = ["pytest>=8", "ruff>=0.9"]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "BLE", "SIM"]
