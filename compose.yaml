# NAS 部署：docker compose up -d --build
# 前置：mkdir -p data && cp .env.example data/env && 填密码
services:
  homeos:
    build:
      context: .
      dockerfile: docker/Dockerfile
    image: homeos:dev
    container_name: homeos
    restart: unless-stopped
    ports:
      - "8080:8080"
    env_file:
      - ./data/env
    environment:
      HOMEOS_DATA_DIR: /data
    # 容器以 uid 1000 运行；宿主机目录要先 chown 到同一个 uid（或在这里覆盖 user）
    # user: "1000:1000"
    volumes:
      # 卷 1：功能目录。agent 唯一能写的地方，备份它就是备份全部用户内容
      - ./web/pages:/app/web/pages
      # 卷 2：运行时状态（米家缓存、opencode session/snapshot、米家 token）。丢了可重来
      - ./data:/data
      # 设备表：改 config/mijia.yaml 后重启容器即可，不用重建镜像
      - ./config:/app/config:ro
    read_only: true
    tmpfs:
      - /tmp:size=512m,mode=1777
    security_opt:
      - no-new-privileges:true
    # 容器里 agent 会执行命令，但根文件系统只读、没有宿主挂载、没有特权
