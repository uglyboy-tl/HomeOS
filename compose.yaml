services:
  homeos:
    image: ghcr.nju.edu.cn/uglyboy-tl/homeos:latest
    container_name: homeos
    restart: unless-stopped
    # 不发布宿主端口：HTTPS 由 Traefik 终止，设备上 getUserMedia 才有 secure context
    labels:
      - traefik.enable=true
      - traefik.http.routers.homeos.rule=Host(`homeos.uglyboy.cn`)
      - traefik.http.services.homeos.loadbalancer.server.port=8080
      - traefik.docker.network=traefik
    networks:
      - traefik
    # compose 的 .env 默认只做插值，不注入容器，所以要显式读
    env_file:
      - .env
    volumes:
      # 功能页：agent 唯一能写的地方，备份它就是备份全部用户内容
      - ./pages:/app/web/pages
      # 必挂：空目录会从镜像里的 /app/defaults 复制一份默认配置
      - ./config:/app/config
      # 米家登录态：库写死 ~/.config/mijia-api，不认 XDG
      - ${XDG_CONFIG_HOME:-${HOME}/.config}/mijia-api:/data/.config/mijia-api
    # 运行时状态（opencode session、米家缓存）不持久化，重启即重建
    tmpfs:
      - /tmp:size=512m
      # 1777 必须显式：有嵌套 bind 时 Docker 把 tmpfs 根建成 root:0755，uid 1000 就写不了
      - /data:size=1g,mode=1777
    read_only: true
    security_opt:
      - no-new-privileges:true
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1:8080/api/ready"]
      interval: 60s
      timeout: 5s
      retries: 3
      start_period: 30s

networks:
  # 由 traefik 栈创建：docker network create traefik
  traefik:
    external: true
