# 自托管部署参考：镜像来自 ghcr.io（由 .github/workflows/image.yml 构建）。
# 用法：改下面两个路径后 `docker compose up -d`；要自己构建就把 image: 换成 build:。
services:
  homeos:
    image: ghcr.io/uglyboy-tl/homeos:latest
    container_name: homeos
    restart: unless-stopped
    # 不发布宿主端口：走 Traefik 反代（域名 → 容器 8080），HTTPS 也由 Traefik 终止，
    # 这样设备上 getUserMedia（麦克风）才有 secure context。
    labels:
      - traefik.enable=true
      - traefik.http.routers.homeos.rule=Host(`homeos.uglyboy.cn`)
      - traefik.http.services.homeos.loadbalancer.server.port=8080
      - traefik.docker.network=traefik
    networks:
      - traefik
    # .env 里的变量全部原样进容器（compose 的 .env 本来只用于插值，不会自动注入，
    # 所以这里显式读取）；默认值统一写在 app/config.py，不在 compose 里重复一遍。
    env_file:
      - .env
    volumes:
      # 功能页：agent 唯一能写的地方，备份它就是备份全部用户内容
      - ./web/pages:/app/web/pages
      # 设备表（config/mijia.yaml）默认用镜像里的那份。想自己改设备表就把下一行放开，
      # 并在栈目录里放一份 config/ 覆盖镜像：
      #   - ./config:/app/config:ro
      # 米家登录态复用宿主机（库写死 ~/.config/mijia-api，不认 XDG）
      - ${XDG_CONFIG_HOME:-${HOME}/.config}/mijia-api:/data/.config/mijia-api
    # 运行时状态（opencode 配置副本/session、米家缓存）不持久化：重启即重建
    tmpfs:
      - /tmp:size=512m
      # 显式 1777：/data 下面还挂着米家登录态（bind），有嵌套挂载时 Docker 会把 tmpfs 根
      # 建成 root:0755，uid 1000 就建不了 /data/config，容器直接起不来
      - /data:size=1g,mode=1777
    read_only: true
    security_opt:
      - no-new-privileges:true
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1:8080/api/ready"]
      interval: 60s
      timeout: 5s
      retries: 3
      start_period: 30s

networks:
  # 与 base/ 里的 traefik 共用（docker network create traefik 或由 traefik 栈创建）
  traefik:
    external: true
